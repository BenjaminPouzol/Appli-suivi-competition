<header class="barre">
  <div class="barre-interieur">
    <a class="marque" routerLink="/">
      <span class="marque-pastille"></span>
      <span class="marque-texte">Suivi Compétition</span>
    </a>

    <div class="barre-droite">
      <nav class="navigation">
        <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">
          Accueil
        </a>
        <a routerLink="/matchs" routerLinkActive="actif">Matchs</a>
        <a routerLink="/competitions" routerLinkActive="actif">Compétitions</a>
        <a routerLink="/a-propos" routerLinkActive="actif">À propos</a>
      </nav>

      <button
        type="button"
        class="bascule-theme"
        (click)="basculerTheme()"
        [attr.aria-label]="
          theme() === 'clair' ? 'Activer le thème sombre' : 'Activer le thème clair'
        "
        [attr.title]="theme() === 'clair' ? 'Activer le thème sombre' : 'Activer le thème clair'"
      >
        @if (theme() === 'clair') {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        } @else {
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
